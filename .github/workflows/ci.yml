# The test suite on every system Studio is built for, against a checkout of the
# RPCortex repository (a few tests check the tool against the firmware's own files).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          - { os: macos-latest, python: "3.8" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: dash1101/RPCortex, path: rpcortex }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Dependencies
        shell: bash
        run: |
          python -m pip install pyserial==3.5
          if [ "$RUNNER_OS" = "Windows" ]; then python -m pip install windows-curses; fi
      - name: Tests
        shell: bash
        env: { RPCORTEX_DIR: "${{ github.workspace }}/rpcortex" }
        run: python -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Link client tests, and the app builds
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
