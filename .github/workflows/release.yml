# A tag vX.Y.Z builds one program file per system, writes SHA256SUMS and
# publishes the release. The program is checked (--version and the test suite)
# on the system it was built for before anything is published.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, file: rpcortex-studio-linux-x64 }
          - { os: windows-2022, file: rpcortex-studio-windows-x64.exe }
          - { os: macos-latest,     file: rpcortex-studio-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: dash1101/RPCortex, path: rpcortex }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        shell: bash
        run: |
          python -m pip install pyserial==3.5 pyinstaller==6.11.1
          if [ "$RUNNER_OS" = "Windows" ]; then python -m pip install windows-curses==2.4.0; fi
      - name: Tests
        env: { RPCORTEX_DIR: "${{ github.workspace }}/rpcortex" }
        run: python -m unittest discover -s tests
      - name: Version matches the tag
        shell: bash
        run: |
          v=$(python studio.py --version | awk '{print $2}')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "studio says $v, the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        shell: bash
        run: |
          name="${{ matrix.file }}"; name="${name%.exe}"
          pyinstaller --onefile --name "$name" --collect-submodules rpctool --collect-submodules serial --exclude-module tests studio.py
          ls -l dist
      - name: The built program runs
        shell: bash
        run: ./dist/${{ matrix.file }} --version
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.file }}", path: "dist/${{ matrix.file }}" }
  android:
    # The Android app: the link client's tests, then a release APK signed with the
    # app's key. Without the signing secrets there is no APK in the release (an
    # APK signed with a throwaway key could never be updated in place).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Link client tests (against Studio's mock device)
        working-directory: android
        run: ./gradlew --no-daemon :core:test
      - name: Signed release APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.STUDIO_KEYSTORE_B64 }}
          STUDIO_KEYSTORE_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
          STUDIO_KEY_ALIAS: ${{ secrets.STUDIO_KEY_ALIAS }}
          STUDIO_KEY_PASSWORD: ${{ secrets.STUDIO_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::No signing key in the repository secrets; this release has no Android app."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/studio.jks"
          export STUDIO_KEYSTORE="$RUNNER_TEMP/studio.jks"
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/rpcortex-studio-android.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../dist/rpcortex-studio-android.apk | head -3
      - uses: actions/upload-artifact@v4
        with: { name: rpcortex-studio-android.apk, path: dist/rpcortex-studio-android.apk, if-no-files-found: ignore }
  publish:
    needs: [build, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Notes
        run: python3 tools/notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" files/* --title "RPCortex Studio $GITHUB_REF_NAME" --notes-file notes.md
