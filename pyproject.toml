[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpcortex-studio"
version = "1.0.0"
description = "RPCortex Studio: a computer's side of an RPCortex v2 device, over its USB serial console"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyserial>=3.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
rpc = "rpctool.cli:main"
rpc-tui = "rpctool.tui:main"
rpcortex-studio = "studio:run"

[tool.setuptools]
packages = ["rpctool", "rpctool.tui"]
py-modules = ["studio"]
